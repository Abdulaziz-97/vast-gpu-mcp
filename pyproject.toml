[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vast-gpu-mcp"
version = "0.2.0"
description = "MCP server that turns any machine (Linux, macOS or Windows; NVIDIA, AMD, Apple Silicon or CPU) into a remote GPU workstation for AI agents like Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "gpu", "vast.ai", "claude", "training", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=2.12,<5",
    "psutil>=5.9",
]

[project.optional-dependencies]
# PyTorch is not listed: install the build that matches your CUDA (cloud GPU images ship it).
llm = ["transformers>=4.45", "accelerate>=0.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
vast-gpu-mcp = "vast_gpu_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Abdulaziz-97/vast-gpu-mcp"
Issues = "https://github.com/Abdulaziz-97/vast-gpu-mcp/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "examples", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
